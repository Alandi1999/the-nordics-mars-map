[package]
name = "nasamars-core"
edition.workspace = true
version.workspace = true
description = "Shared no_std layer data model (satellite, hub, glove)"

[dependencies]
cobs = { version = "0.3", default-features = false }
crc = { version = "3.4.0", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-crc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
